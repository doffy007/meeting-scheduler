version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meeting_scheduler_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting_scheduler_app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=db
      - DSN=postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/cred:/app/src/cred:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: